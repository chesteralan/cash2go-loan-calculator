name: CI / CD Audit & Codebase Health

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Security Vulnerability Audit
        run: bun audit --audit-level=high || echo "bun audit unavailable, skipping"

      - name: TypeScript Static Typecheck & Lint
        run: bun run lint

      - name: Prettier Code Format Check
        run: bun run format:check

      - name: Knip Unused Dependencies & Dead Code Audit
        run: bunx knip

      - name: Fallow-rs Codebase Health & Dead Code Analysis
        run: bunx fallow dead-code

      - name: Production Build Verification
        run: bun run build
