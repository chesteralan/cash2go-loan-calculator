name: CI / CD Audit & Codebase Health

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: TypeScript Static Typecheck & Lint
        run: npm run lint

      - name: Prettier Code Format Check
        run: npm run format:check

      - name: Knip Unused Dependencies & Dead Code Audit
        run: npx knip

      - name: Fallow-rs Codebase Health & Dead Code Analysis
        run: npx fallow dead-code

      - name: Production Build Verification
        run: npm run build
